name: CI/CD - Build, Publish & Deploy Docker Images

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Select which service to build and publish"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "backend"
          - "frontend"
          - "admin-frontend"
      image_tag:
        description: "Docker Image Tag (e.g. latest, v1.0.0)"
        required: false
        type: string
        default: "latest"
      deploy:
        description: "Execute CD deployment step after building?"
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # 1. CI JOB: FASTAPI BACKEND
  # ========================================================
  build-and-push-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.service == 'all' || github.event.inputs.service == 'backend' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run Backend Unit & Integration Tests
        run: |
          cd backend
          python -m pytest tests/test_api.py tests/test_payments.py -v
        env:
          DATABASE_URL: sqlite:///./test.db
          STRIPE_SECRET_KEY: sk_test_mock_secret_key_123
          STRIPE_WEBHOOK_SECRET: whsec_mock_webhook_secret_123

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Image Tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="latest"; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aura-kicks-backend:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/aura-kicks-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # 2. CI JOB: STOREFRONT FRONTEND (REACT / VITE)
  # ========================================================
  build-and-push-frontend:
    name: Build & Push Customer Frontend
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.service == 'all' || github.event.inputs.service == 'frontend' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Image Tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="latest"; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and Push Customer Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '' }}
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aura-kicks-frontend:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/aura-kicks-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # 3. CI JOB: ADMIN FRONTEND (REACT / VITE)
  # ========================================================
  build-and-push-admin:
    name: Build & Push Admin Frontend
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.service == 'all' || github.event.inputs.service == 'admin-frontend' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Image Tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="latest"; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and Push Admin Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-frontend
          file: ./admin-frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_ADMIN_API_URL || vars.VITE_API_URL || '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aura-kicks-admin:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/aura-kicks-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # 4. CD JOB: CONTINUOUS DEPLOYMENT (PULL LATEST & RESTART)
  # ========================================================
  deploy-containers:
    name: CD - Pull Latest & Deploy
    runs-on: ubuntu-latest
    needs: [build-and-push-backend, build-and-push-frontend, build-and-push-admin]
    if: |
      always() &&
      (needs.build-and-push-backend.result == 'success' || needs.build-and-push-backend.result == 'skipped') &&
      (needs.build-and-push-frontend.result == 'success' || needs.build-and-push-frontend.result == 'skipped') &&
      (needs.build-and-push-admin.result == 'success' || needs.build-and-push-admin.result == 'skipped') &&
      (github.event_name == 'push' || github.event.inputs.deploy == 'true' || github.event.inputs.deploy == true)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ========================================================
      # Render CD Deployment (Triggered via Render Deploy Hook URLs)
      # ========================================================
      - name: Deploy Backend to Render
        if: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK != '' && (needs.build-and-push-backend.result == 'success') }}
        run: |
          echo "Triggering Render deployment for Backend..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}")
          echo "Render Backend Deploy Hook response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✓ Render Backend deployment triggered successfully!"
          else
            echo "⚠ Warning: Received status $HTTP_STATUS from Render Backend deploy hook."
          fi

      - name: Deploy Customer Frontend to Render
        if: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK != '' && (needs.build-and-push-frontend.result == 'success') }}
        run: |
          echo "Triggering Render deployment for Customer Frontend..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}")
          echo "Render Frontend Deploy Hook response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✓ Render Frontend deployment triggered successfully!"
          else
            echo "⚠ Warning: Received status $HTTP_STATUS from Render Frontend deploy hook."
          fi

      - name: Deploy Admin Frontend to Render
        if: ${{ secrets.RENDER_ADMIN_DEPLOY_HOOK != '' && (needs.build-and-push-admin.result == 'success') }}
        run: |
          echo "Triggering Render deployment for Admin Frontend..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_ADMIN_DEPLOY_HOOK }}")
          echo "Render Admin Deploy Hook response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✓ Render Admin Frontend deployment triggered successfully!"
          else
            echo "⚠ Warning: Received status $HTTP_STATUS from Render Admin deploy hook."
          fi

      # Option B: Generic / Combined Webhook Deploy (e.g. Render Blueprint or custom webhook)
      - name: Trigger Combined Webhook Deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' || secrets.DEPLOY_WEBHOOK_URL != '' }}
        run: |
          HOOK_URL="${{ secrets.RENDER_DEPLOY_HOOK_URL || secrets.DEPLOY_WEBHOOK_URL }}"
          echo "Triggering Render deploy webhook: $HOOK_URL"
          curl -sS -X POST "$HOOK_URL"
          echo "✓ Deploy hook triggered!"

      # Option C: SSH Deployment to Remote Server (Fallback if self-hosting VPS)
      - name: Deploy to Remote Server via SSH
        if: ${{ secrets.SERVER_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.SERVER_DEPLOY_PATH || '/opt/aura-kicks' }}"
            mkdir -p $DEPLOY_PATH
            cd $DEPLOY_PATH

            # Log in to Docker Hub on server
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Export Docker Hub credentials and tag for compose
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export IMAGE_TAG="${{ github.event.inputs.image_tag || 'latest' }}"

            # Pull latest published Docker images
            docker compose -f docker-compose.prod.yml pull

            # Recreate containers with zero downtime
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Prune dangling layers
            docker image prune -f

            echo "Deployment completed successfully for tag $IMAGE_TAG!"

      - name: Deployment Instructions & Summary
        run: |
          echo "=========================================================="
          echo "CI/CD Pipeline Execution Summary"
          echo "=========================================================="
          echo "Docker Hub User: ${{ secrets.DOCKERHUB_USERNAME }}"
          echo "Built Images Published to Docker Hub:"
          echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/aura-kicks-backend:${{ github.event.inputs.image_tag || 'latest' }}"
          echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/aura-kicks-frontend:${{ github.event.inputs.image_tag || 'latest' }}"
          echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/aura-kicks-admin:${{ github.event.inputs.image_tag || 'latest' }}"
          echo "=========================================================="
