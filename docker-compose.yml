services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aura-kicks-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@localhost:5432/blinkit_footwear}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey_blinkit_clone_123_footwear_production_secret}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey_blinkit_clone_123_footwear_production_secret}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL_S3:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - NEON_STORAGE_BUCKET=${NEON_STORAGE_BUCKET:-premium-footwear}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@aurakicks.com}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - PORT=5000
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - aura-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
        - VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY:-}
    container_name: aura-kicks-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - aura-network

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    container_name: aura-kicks-admin
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - aura-network

volumes:
  backend_uploads:

networks:
  aura-network:
    driver: bridge
